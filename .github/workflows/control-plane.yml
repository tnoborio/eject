name: Control plane

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/control-plane.yml
      - control-plane/**
      - protocol/**
      - package.json
      - package-lock.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/control-plane.yml
      - control-plane/**
      - protocol/**
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  domain:
    name: Domain and protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage

  postgres:
    name: PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eject
          POSTGRES_PASSWORD: eject
          POSTGRES_DB: eject_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eject -d eject_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://eject:eject@127.0.0.1:5432/eject_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:postgres --workspace @eject/control-plane

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
